# rumdl config — Markdown lint + format (one tool, both roles). Scaffolded with
# `rumdl init` then tuned for caret. hk drives rumdl via Builtins.rumdl: `rumdl fmt`
# formats (the `fix` hook), `rumdl check` lints (the `check` hook). Reference:
# https://rumdl.dev
[global]
# Inline HTML (MD033) — the UI sanitizes rendered Markdown with DOMPurify, so this is source
# hygiene, not a security gate. Bare URLs (MD034) are intentional. MD041 (file must open with an
# H1) is off because caret's slash-command files (commands/*.md) intentionally lead with
# frontmatter + prompt prose, not a title heading.
disable = ["MD033", "MD034", "MD041"]

# Respect .gitignore when scanning directories (rumdl init default).
respect-gitignore = true

# Paths rumdl never scans — `rumdl init`'s defaults, kept as-is.
exclude = [
  ".git",
  ".github",
  "node_modules",
  "vendor",
  "dist",
  "build",
  "LICENSE.md",
]

[MD013]
# Enforce a 90-char line length on prose and auto-reflow to it: reflow-mode "normalize"
# rewraps paragraphs uniformly, stripping irregular line breaks. Skip code blocks and
# tables, where long URLs, commands, and wide columns shouldn't be reflowed.
line-length = 90
code-blocks = false
tables      = false
reflow      = true
reflow-mode = "normalize"
