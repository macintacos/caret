# Bun test-runner config. The UI component suite (ui/src/components/*.test.ts)
# mounts Svelte 5 components under happy-dom; the preload compiles `.svelte`
# files to client-side output (see ui/test-svelte-preload.ts). The preload is
# inert for the backend suite — its onLoad filters match only `.svelte` files —
# so it is safe to register globally here. The companion `--conditions browser`
# flag (on the test command) selects svelte's client runtime entry; the backend
# suite passes unchanged under it.
#
# The flag cannot live here: export conditions are a module-resolution input
# Bun reads from the CLI (`--conditions`), not a [test] config key — so the
# canonical entry points carry it (.mise/tasks/test, package.json `test`). Bare
# `bun test` therefore resolves svelte's server runtime, which ui/test-mount.ts
# detects and rejects with an actionable error rather than the cryptic mount()
# crash (EXC-537).
#
# `--timeout` rides on those same two entry points for the same reason (EXC-1056):
# `[test]` has no `timeout` key, and a preload calling `setDefaultTimeout` reaches
# only some files of a multi-file run. See scripts/tasks/test.ts.
[test]
# rumdl-preload points the plan formatter (src/plan/rumdl.ts) at the mise-pinned
# rumdl so tests run offline; svelte-preload compiles .svelte for the UI suite.
preload = ["./test/support/rumdl-preload.ts", "./ui/test-svelte-preload.ts"]
