[project]
site_name = "caret"
site_url  = "https://macintacos.github.io/caret/"
repo_url  = "https://github.com/macintacos/caret"
repo_name = "macintacos/caret"
extra_css = ["stylesheets/caret.css"]

# Pages kept off the site. One merely left out of `nav` is still built and searchable.
exclude_docs = """
/agents/
/README.md
/DEVELOPMENT.md
/RUNNING.md
/CONFIGURING.md
/ARCHITECTURE.md
"""

# Each section leads with its index.md: a section with no page renders a dead link.
nav = [
  { "Home" = "index.md" },
  { "Tutorial" = [
    "tutorial/index.md",
    { "Review your first plan" = "tutorial/first-plan.md" },
  ] },
  { "How-to guides" = [
    "how-to/index.md",
    { "Install caret" = "how-to/install.md" },
    { "Read a plan" = "how-to/read-a-plan.md" },
    { "Write feedback" = "how-to/write-feedback.md" },
    { "Get notified about plans" = "how-to/notifications.md" },
    { "Make your own theme" = "how-to/make-a-theme.md" },
    { "Find caret's logs" = "how-to/logs.md" },
    { "Diagnose a problem" = "how-to/diagnostics.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Glossary" = "reference/glossary.md" },
    { "Config file" = "reference/config-file.md" },
    { "Environment variables" = "reference/environment-variables.md" },
    { "Platform support" = "reference/platform-support.md" },
    { "Theme file format" = "reference/theme-files.md" },
    { "Built-in themes" = "reference/built-in-themes.md" },
  ] },
  { "Explanation" = [
    "explanation/index.md",
  ] },
]

[project.theme]
features = ["content.code.copy", "navigation.sections"]

[[project.theme.palette]]
media       = "(prefers-color-scheme: light)"
scheme      = "default"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media       = "(prefers-color-scheme: dark)"
scheme      = "slate"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
