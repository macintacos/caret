[project]
site_name = "caret"
site_url  = "https://macintacos.github.io/caret/"
repo_url  = "https://github.com/macintacos/caret"
repo_name = "macintacos/caret"
extra_css = ["stylesheets/caret.css"]

# Pages kept off the site. One merely left out of `nav` is still built and searchable.
exclude_docs = """
/agents/
/README.md
/DEVELOPMENT.md
/ARCHITECTURE.md
"""

nav = [
  { "Home" = "index.md" },
  { "Tutorial" = [
    { "Review your first plan" = "tutorial/first-plan.md" },
  ] },
  { "How-to guides" = [
    { "Install caret" = "how-to/install.md" },
    { "Read a plan" = "how-to/read-a-plan.md" },
    { "Write feedback" = "how-to/write-feedback.md" },
    { "Get notified about plans" = "how-to/notifications.md" },
    { "Show caret in the menu bar" = "how-to/menubar.md" },
    { "Make your own theme" = "how-to/make-a-theme.md" },
    { "Run the background service" = "how-to/background-service.md" },
    { "Open caret from another device" = "how-to/remote-access.md" },
    { "Send plans to caret on a server" = "how-to/remote-review.md" },
    { "Turn caret off" = "how-to/turn-off.md" },
    { "Find caret's logs" = "how-to/logs.md" },
    { "Diagnose a problem" = "how-to/diagnostics.md" },
    { "Call the review tool from your own skill" = "how-to/review-tool.md" },
  ] },
  { "Reference" = [
    { "Glossary" = "reference/glossary.md" },
    { "Config file" = "reference/config-file.md" },
    { "Environment variables" = "reference/environment-variables.md" },
    { "Platform support" = "reference/platform-support.md" },
    { "Theme file format" = "reference/theme-files.md" },
    { "Built-in themes" = "reference/built-in-themes.md" },
  ] },
  { "Explanation" = [
    { "How caret works" = "explanation/how-caret-works.md" },
    { "The background service" = "explanation/background-service.md" },
    { "What caret install adds" = "explanation/caret-install.md" },
    { "Plan formatting" = "explanation/plan-formatting.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

[project.theme]
logo     = "assets/carrot.svg"
features = ["content.code.copy", "navigation.sections", "navigation.tabs"]

[[project.theme.palette]]
media       = "(prefers-color-scheme: light)"
scheme      = "default"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media       = "(prefers-color-scheme: dark)"
scheme      = "slate"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
