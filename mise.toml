[settings]
# Commit mise.lock for reproducible, checksum-pinned tool versions.
lockfile = true

# HK_MISE routes hk's git-hook subprocesses through `mise x`, so each hook step
# uses the versions pinned below — even for committers who never activated mise.
[env]
HK_MISE = 1

[tools]
# Keep hk in lockstep with hk.pkl's amends/import version; the two are compared exactly,
# so even a patch bump landing here needs the hk.pkl edit. test/structure/hk-pin.test.ts
# fails if they diverge.
hk  = "1.55"
pkl = "0"
bun = "1.3"
# Held at 2.4 until EXC-1074 works through 2.5's lint-rule moves.
biome = "2.4"
# Non-web formatters/linters (declared so hk runs these pinned versions, not global ones).

# rumdl is held at the release mise.lock resolved, because caret ships that same release
# to end users — so moving it is a deliberate, verified bump, never a routine `mise up`
# sweep. Why the two must agree, and what else moves with them: doc/agents/rumdl-rules.md.
rumdl      = "latest" # aqua:rvben/rumdl (Markdown format + lint; mise.lock pins the version)
yamlfmt    = "0"      # aqua:google/yamlfmt
taplo      = "0"      # aqua:tamasfe/taplo
shellcheck = "0"      # aqua:koalaman/shellcheck
shfmt      = "3.13"   # aqua:mvdan/sh

# (Re)register git hooks whenever tools are installed or updated.
[hooks]
postinstall = "hk install --mise"

# Every task is a file task in .mise/tasks/ — a thin forwarder into the caret
# tasks CLI (scripts/tasks/cli.ts), which owns each task's flags and --help.
# Each one sources scripts/bootstrap.sh first, so a task run from a fresh clone
# installs the tools and deps that CLI needs instead of dying on them.
