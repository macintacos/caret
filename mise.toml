[settings]
# Commit mise.lock for reproducible, checksum-pinned tool versions.
lockfile = true

# HK_MISE routes hk's git-hook subprocesses through `mise x`, so each hook step
# uses the versions pinned below — even for committers who never activated mise.
[env]
HK_MISE = 1

[tools]
# Keep hk in lockstep with hk.pkl's amends/import version.
hk    = "1.50"
pkl   = "0"
bun   = "1.3"
biome = "2.4"
# Non-web formatters/linters (declared so hk runs these pinned versions, not global ones).
rumdl      = "0.2.47" # aqua:rvben/rumdl (Markdown format + lint; kept in lockstep with src/plan/rumdl.ts)
yamlfmt    = "0"      # aqua:google/yamlfmt
taplo      = "0"      # aqua:tamasfe/taplo
shellcheck = "0"      # aqua:koalaman/shellcheck
shfmt      = "3.13"   # aqua:mvdan/sh

# (Re)register git hooks whenever tools are installed or updated.
[hooks]
postinstall = "hk install --mise"

# Every task is a file task in .mise/tasks/ — a thin forwarder into the caret
# tasks CLI (scripts/tasks/cli.ts), which owns each task's flags and --help.
