[settings]
# Commit mise.lock for reproducible, checksum-pinned tool versions.
lockfile = true

# HK_MISE routes hk's git-hook subprocesses through `mise x`, so each hook step
# uses the versions pinned below — even for committers who never activated mise.
[env]
HK_MISE = 1

[tools]
# Keep hk in lockstep with hk.pkl's amends/import version.
hk    = "1.45.0"
pkl   = "0.31.1"
bun   = "1.3.14"
biome = "2.4.15"
# Non-web formatters/linters (declared so hk runs these pinned versions, not global ones).
rumdl      = "latest" # aqua:rvben/rumdl (Markdown format + lint; mise.lock pins the version)
yamlfmt    = "0.21.0" # aqua:google/yamlfmt
taplo      = "0.10.0" # aqua:tamasfe/taplo
shellcheck = "0.11.0" # aqua:koalaman/shellcheck
shfmt      = "3.13.1" # aqua:mvdan/sh

# (Re)register git hooks whenever tools are installed or updated.
[hooks]
postinstall = "hk install --mise"

# The other tasks are file tasks in .mise/tasks/; preflight is a TOML task so
# the gate runs the TS orchestrator (concurrent DAG + live display — EXC-462).
[tasks.preflight]
description = "Pre-push gate (check-only): lint, unit + e2e tests, and build, run concurrently"
run         = "bun scripts/preflight.ts"
