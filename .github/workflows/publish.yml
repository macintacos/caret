name: publish
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: false # no cache on a release path (poisoning)
      - name: Check the tag matches package.json
        run: |
          version="$(jq -r .version package.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: mise run smoke bundle
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
  # No checkout: only the built tarball and npm run beside id-token: write.
  stage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0 # bundles npm 11.19.1; `npm stage` needs >= 11.15.0
          package-manager-cache: false # no cache in the job that holds the OIDC token
      # The downloaded artifact is the only .tgz.
      - name: Stage the publish
        run: |
          npm stage publish ./*.tgz --json > stage.json
          id="$(jq -er '.["@macintacos/caret"].stageId' stage.json)"
          echo "::notice title=npm-stage-id::$id"
